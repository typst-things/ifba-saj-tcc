schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Pacote Typst (compiler 0.15.1, entrypoint lib.typ) que implementa o modelo ABNT
  de TCC do IFBA campus Santo Antônio de Jesus (curso ADS), seguindo NBR 14724,
  NBR 10520:2023 e NBR 6023. Código em src/*.typ; exemplo demonstrativo completo
  e compilável em example/main.typ (variantes digital e impressão). Convenções:
  helpers privados com prefixo "_", nomes públicos sem prefixo, estado global via
  state("ifba-saj-config"). Dependências @preview: codly, codly-languages, cetz,
  cetz-plot. Escrever artefatos em pt-BR.

